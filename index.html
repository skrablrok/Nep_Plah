<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nep Pleh — obnovljene toner kasete, narejene v Sloveniji</title>
<meta name="description" content="Originalne toner kasete, strokovno obnovljene v Sloveniji. Preizkušena kakovost tiska, brez cenenih kitajskih kopij. Spletna trgovina, obnova kaset in servis tiskalnikov.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d1b2a;          /* temno modra namesto črne */
  --ink-2:#33415a;
  --muted:#66728a;
  --line:#e3e7ef;
  --paper:#ffffff;
  --card:#ffffff;
  --accent:#0087c1;       /* cian — glavna barva */
  --accent-soft:#e3f4fb;
  --cyan:#00a3e0; --magenta:#e6007e; --yellow:#ffd200; --key:#0d1b2a;
  --t-K:#eef1f6; --t-C:#e1f4fc; --t-M:#fde7f2; --t-Y:#fff6cc;
  --warn:#e6007e;
  --radius:14px;
  --wrap:1180px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Inter Tight",Inter,sans-serif;letter-spacing:-.02em;margin:0;line-height:1.08}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .15s var(--ease),background .15s}
.btn:hover{background:var(--accent);border-color:var(--accent)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.btn.sm{height:38px;padding:0 16px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}

/* ---------- Header ---------- */
header.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);transition:box-shadow .3s}
header.top.scrolled{box-shadow:0 6px 24px -12px rgba(13,27,42,.18)}
.progress{position:absolute;left:0;bottom:-1px;height:3px;width:100%;transform-origin:left;transform:scaleX(var(--p,0));background:linear-gradient(90deg,var(--cyan) 0 25%,var(--magenta) 25% 50%,var(--yellow) 50% 75%,var(--key) 75%);pointer-events:none}
.top .wrap{display:flex;align-items:center;height:72px;gap:32px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:"Inter Tight";font-weight:700;font-size:20px;letter-spacing:-.03em}
.logo-mark{width:28px;height:28px;display:grid;grid-template-columns:1fr 1fr;gap:3px}
.logo-mark i{display:block;border-radius:3px}
.logo-mark i:nth-child(1){background:var(--cyan)}.logo-mark i:nth-child(2){background:var(--magenta)}.logo-mark i:nth-child(3){background:var(--yellow)}.logo-mark i:nth-child(4){background:var(--key)}
nav.main{display:flex;gap:28px;margin-left:auto}
nav.main a{text-decoration:none;font-size:15px;color:var(--ink-2)}
nav.main a:hover,nav.main a.on{color:var(--ink)}
.cart-btn{position:relative;display:flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500;font-size:14px}
.cart-btn:hover{border-color:var(--ink)}
.cart-count{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--magenta);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center}
.menu-btn{display:none;width:42px;height:42px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer}

/* ---------- Hero ---------- */
.hero{padding:72px 0 128px;background:radial-gradient(circle,rgba(0,135,193,.13) 1px,transparent 1.6px) 0 0/22px 22px,linear-gradient(180deg,#eef8fd 0%,#e2f2fa 100%);border-bottom:1px solid #d3eaf5}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:64px;align-items:center}
.hero-grid>*,.pd>*,.co>*,.contact>*{min-width:0}
.hero h1{font-size:clamp(44px,7vw,92px);font-weight:700}
.hero h1 .strike{color:var(--muted);font-weight:500}
.hero h1 .strike s{text-decoration:none;background:linear-gradient(var(--magenta),var(--magenta)) no-repeat 0 56%/100% 5px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero h1 .hl{background:linear-gradient(var(--yellow),var(--yellow)) no-repeat 0 88%/100% 24%}
.cmyk-bar{display:flex;height:6px;border-radius:6px;overflow:hidden;width:96px;margin-bottom:22px}.cmyk-bar i{flex:1}.cmyk-bar i:nth-child(1){background:var(--cyan)}.cmyk-bar i:nth-child(2){background:var(--magenta)}.cmyk-bar i:nth-child(3){background:var(--yellow)}.cmyk-bar i:nth-child(4){background:var(--key)}
.hero .lead{font-size:19px;color:var(--ink-2);max-width:520px;margin:28px 0 36px}
.search{display:flex;align-items:center;gap:8px;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 20px;transition:border-color .15s}
.search:focus-within{border-color:var(--ink)}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:16px;min-width:0}
.hero-hint{font-size:13px;color:var(--muted);margin-top:12px;padding-left:20px}
.hero-art{position:relative;aspect-ratio:1/1}
.hero-art::before{content:"";position:absolute;inset:28px 0 0 28px;background:var(--yellow);border-radius:24px}
.hero-art .ph{position:absolute;inset:0 28px 28px 0;border-radius:24px;overflow:hidden;background:#d9d4cc;box-shadow:0 30px 60px -30px rgba(13,27,42,.45)}
.hero-art .ph img{display:block;width:100%;height:112%;margin-top:-6%;object-fit:cover}
.hero-art .stack{width:88%;display:grid;grid-template-columns:1fr 1fr;gap:4% 6%}
.hero-art .stack svg{width:100%}
.seal{position:absolute;top:22px;right:22px;width:112px;height:112px;border-radius:50%;background:var(--magenta);color:#fff;display:grid;place-items:center;text-align:center;font-family:"Inter Tight";font-weight:700;font-size:13px;line-height:1.15;letter-spacing:.02em;transform:rotate(calc(-8deg + var(--rot,0deg)))}
.seal small{display:block;font-family:Inter;font-weight:500;font-size:10px;opacity:.85;letter-spacing:.1em;text-transform:uppercase;margin-top:4px}

/* ---------- Proof row ---------- */
.proof{position:relative;z-index:2;margin-top:-64px}
.proof .wrap{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-radius:20px;padding:0;width:calc(100% - 48px);max-width:calc(var(--wrap) - 48px);box-shadow:0 0 0 1px var(--line),0 28px 56px -30px rgba(13,27,42,.4)}
.proof .wrap>div{position:relative;padding:28px;border-left:1px solid var(--line)}
.proof .wrap>div:first-child{border-left:0}
.proof .wrap>div::before{content:"";position:absolute;top:0;left:28px;width:40px;height:4px;border-radius:0 0 4px 4px}
.proof .wrap>div:nth-child(1)::before{background:var(--cyan)}.proof .wrap>div:nth-child(2)::before{background:var(--magenta)}.proof .wrap>div:nth-child(3)::before{background:var(--yellow)}.proof .wrap>div:nth-child(4)::before{background:var(--key)}
.proof b{display:block;font-family:"Inter Tight";font-size:28px;letter-spacing:-.02em}
.proof span{font-size:14px;color:var(--muted)}

/* ---------- Sections ---------- */
section.block{padding:112px 0}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:48px}
.sec-head h2{font-size:clamp(32px,4.4vw,52px);max-width:720px}
.sec-head p{max-width:420px;color:var(--muted)}

/* ---------- Quality / comparison ---------- */
.quality{background:var(--ink);color:#f3f6fa;position:relative}
.quality::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;transform-origin:left;transition:transform 1.2s var(--ease);background:linear-gradient(90deg,var(--cyan) 0 25%,var(--magenta) 25% 50%,var(--yellow) 50% 75%,#3a4d66 75%)}
.js .quality:not(.in)::before{transform:scaleX(0)}
.quality .eyebrow{color:var(--yellow)}
.quality .sec-head p{color:#a7b3c6}
.compare{border:1px solid #23344a;border-radius:var(--radius);overflow:hidden}
.compare-row{display:grid;grid-template-columns:1fr 1.3fr 1.3fr;border-top:1px solid #23344a}
.compare-row:first-child{border-top:0}
.compare-row>div{padding:20px 24px}
.compare-row.head{background:#132639;font-family:"Inter Tight";font-weight:600;font-size:15px}
.compare-row.head .us{color:var(--cyan)}
.compare-row.head .them{color:#ff6fb5}
.compare-row .k{color:#a7b3c6;font-size:14px}
.compare-row .us{display:flex;gap:12px;align-items:flex-start}
.compare-row .them{display:flex;gap:12px;align-items:flex-start;color:#8e9bb0}
.ico{flex:0 0 20px;width:20px;height:20px;margin-top:2px}
.quality-note{margin-top:20px;font-size:13px;color:#7c7d77}

/* ---------- Testni izpis: original proti kopiji ---------- */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:56px;margin:0 auto 72px;max-width:960px}
.cmp>*{min-width:0}
.cmp figure{margin:0}
.cmp-sub{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:28px;padding-top:8px}
.cmp-sub h3{font-size:clamp(24px,2.6vw,32px);color:#fff}
.cmp-sub span{font-size:14px;color:#a7b3c6}
.sheet{position:relative;background:#fdfdfb;border-radius:10px;aspect-ratio:210/250;padding:8% 9% 7%;display:flex;flex-direction:column;gap:7%;box-shadow:0 30px 60px -24px rgba(0,0,0,.6);transform:rotate(-.8deg)}
.cmp figure:last-child .sheet{transform:rotate(.8deg)}
.sheet .cm{position:absolute;width:14px;height:14px}
.sheet .cm::before,.sheet .cm::after{content:"";position:absolute;background:#0d1b2a;opacity:.5}
.sheet .cm::before{width:14px;height:1px}.sheet .cm::after{width:1px;height:14px}
.cm.tl{top:14px;left:14px}.cm.tr{top:14px;right:14px;transform:scaleX(-1)}.cm.bl{bottom:14px;left:14px;transform:scaleY(-1)}.cm.br{bottom:14px;right:14px;transform:scale(-1)}
.sh-head{display:flex;justify-content:space-between;font-size:clamp(10px,1vw,12px);font-weight:600;color:#33415a;border-bottom:1px solid #0d1b2a;padding-bottom:8px;font-variant-numeric:tabular-nums}
.patches{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.patches span{aspect-ratio:1.6/1;border-radius:3px}
.sh-lines{display:grid;gap:9px}
.sh-lines span{height:7px;border-radius:4px;background:#0d1b2a;opacity:.85}
.ramp{height:20px;border-radius:4px;background:linear-gradient(90deg,#fff,#0d1b2a)}
.regs{display:flex;justify-content:space-between;margin-top:auto}
.regs svg{width:26px;height:26px}
.ok-stamp{position:absolute;right:8%;bottom:7%;border:2px solid var(--cyan);color:var(--cyan);border-radius:8px;font-size:clamp(10px,1vw,12px);font-weight:600;padding:8px 12px;transform:rotate(-7deg);text-align:center;line-height:1.3;background:rgba(253,253,251,.85)}
.ok-stamp b{display:block;font-family:"Inter Tight";font-size:clamp(18px,2vw,26px);letter-spacing:.02em}
.sheet.bad .patches{opacity:.62;filter:saturate(.75) hue-rotate(-8deg)}
.sheet.bad .patches span:nth-child(5),.sheet.bad .patches span:nth-child(10){filter:brightness(1.25)}
.sheet.bad .sh-lines span{opacity:.45}
.sheet.bad .ramp{background:linear-gradient(90deg,#fff 0,#fff 30%,#77736a 60%,#5c5a55 100%)}
.sheet.bad::after{content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;
  background:
   repeating-linear-gradient(90deg,transparent 0 23%,rgba(253,253,251,.85) 23% 24.2%,transparent 24.2% 57%,rgba(253,253,251,.75) 57% 58.5%,transparent 58.5% 100%),
   radial-gradient(circle at 18% 72%,rgba(13,27,42,.16) 0 1px,transparent 1.6px) 0 0/37px 29px,
   radial-gradient(circle at 63% 31%,rgba(13,27,42,.12) 0 .8px,transparent 1.4px) 7px 11px/53px 41px,
   radial-gradient(circle at 40% 55%,rgba(13,27,42,.1) 0 1.4px,transparent 2px) 19px 3px/71px 67px,
   linear-gradient(180deg,transparent 70%,rgba(13,27,42,.06) 70% 74%,transparent 74%)}
.cmp figcaption{display:flex;gap:12px;align-items:center;margin-top:26px;font-family:"Inter Tight";font-weight:600;font-size:18px;color:#fff}
.cmp figcaption small{font-family:Inter;font-weight:400;font-size:14px;color:#a7b3c6}
.cmp figure.bad-fig figcaption{color:#ff6fb5}

/* ---------- Product cards ---------- */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;transition:border-color .2s,transform .2s var(--ease)}
.card:hover{border-color:#cfcec7;transform:translateY(-2px)}
.card a.thumb{position:relative;display:block;aspect-ratio:5/4;background:#e4e0da;text-decoration:none;overflow:hidden}
.card a.thumb img,.pd-art img,.mini img{display:block;width:100%;height:100%;object-fit:cover}
.chip-c{position:absolute;left:12px;bottom:12px;display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:99px;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);font-size:12px;font-weight:600;color:var(--ink)}
.chip-c i{width:10px;height:10px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.card[data-c=C] a.thumb,.pd-art[data-c=C],.mini[data-c=C]{background:var(--t-C)}
.card[data-c=M] a.thumb,.pd-art[data-c=M],.mini[data-c=M]{background:var(--t-M)}
.card[data-c=Y] a.thumb,.pd-art[data-c=Y],.mini[data-c=Y]{background:var(--t-Y)}
.card[data-c=K] a.thumb,.pd-art[data-c=K],.mini[data-c=K]{background:var(--t-K)}
.card a.thumb svg{width:70%}
.card .body{padding:18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .brand{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card h3{font-size:18px}
.card h3 a{text-decoration:none}
.card .meta{font-size:13px;color:var(--muted)}
.card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:14px}
.price{font-family:"Inter Tight";font-weight:600;font-size:20px;letter-spacing:-.01em}
.price small{font-family:Inter;font-weight:400;font-size:12px;color:var(--muted);margin-left:2px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#006a99;background:var(--accent-soft);border-radius:99px;padding:3px 10px;width:max-content}
.add{width:40px;height:40px;border-radius:50%;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.add:hover{transform:scale(1.06)}
.add.done{background:var(--magenta);border-color:var(--magenta)}

/* ---------- Services ---------- */
.services{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.service{border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.svc-img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;transition:transform .7s var(--ease)}
.service:hover .svc-img{transform:scale(1.04)}
.svc-b{position:relative;padding:0 32px 36px;margin-top:-20px}
.svc-b .n{box-shadow:0 0 0 5px var(--bg)}
.service:nth-child(1){--bg:var(--t-C)}.service:nth-child(2){--bg:var(--t-M)}.service:nth-child(3){--bg:var(--t-Y)}
.service{background:var(--bg)}
.service .n{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;font-family:"Inter Tight";font-weight:700;font-size:14px;color:#fff}
.service:nth-child(1) .n{background:var(--cyan)}.service:nth-child(2) .n{background:var(--magenta)}.service:nth-child(3) .n{background:var(--yellow);color:var(--ink)}
.service h3{font-size:24px;margin:16px 0 12px}
.service p{color:var(--ink-2);font-size:15px}

/* ---------- Contact ---------- */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start}
.contact dl{margin:0;display:grid;grid-template-columns:120px 1fr;row-gap:14px;font-size:16px}
.contact dt{color:var(--muted)}
.contact dd{margin:0}
.map{aspect-ratio:4/3;border-radius:var(--radius);border:1px solid var(--line);background:
  linear-gradient(#d3ecf8 1px,transparent 1px) 0 0/40px 40px,
  linear-gradient(90deg,#d3ecf8 1px,transparent 1px) 0 0/40px 40px,var(--t-C);display:grid;place-items:center}
.map{position:relative;overflow:hidden;background:var(--t-C)}
.map-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.75) contrast(.97)}
.map .pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:3px solid #fff}
.map-attr{position:absolute;right:8px;bottom:6px;font-size:11px;background:rgba(255,255,255,.8);padding:1px 6px;border-radius:4px;color:var(--muted)}
.map-attr a{color:inherit}
.map-lbl{text-decoration:none;color:var(--ink);position:absolute;left:20px;bottom:20px;background:#fff;border-radius:12px;padding:12px 16px;font-size:14px;line-height:1.45;box-shadow:0 10px 30px -14px rgba(13,27,42,.35);transition:transform .25s var(--ease)}
.map-lbl b{color:var(--accent);font-weight:600}
.map-lbl:hover{transform:translateY(-3px)}
.pin{width:18px;height:18px;border-radius:50%;background:var(--magenta);box-shadow:0 0 0 10px rgba(230,0,126,.15)}

/* ---------- Footer ---------- */
footer{border-top:6px solid;border-image:linear-gradient(90deg,var(--cyan) 0 25%,var(--magenta) 25% 50%,var(--yellow) 50% 75%,var(--key) 75%) 1;padding:48px 0;font-size:14px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
footer a{text-decoration:none}
footer a:hover{color:var(--ink)}

/* ---------- Shop view ---------- */
.shop-head{padding:64px 0 32px}
.shop-head h1{font-size:clamp(36px,5vw,60px)}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:32px;position:sticky;top:72px;background:var(--paper);z-index:5}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:14px}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent)!important;color:#fff;border-color:var(--ink)}
.toolbar .search{flex:1;min-width:220px;max-width:340px;margin-left:auto;padding:4px 4px 4px 16px}
.toolbar .search input{font-size:14px;height:30px}
select.sort{height:38px;border-radius:99px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:14px;cursor:pointer}
.empty{padding:80px 0;text-align:center}
.empty h3{font-size:24px;margin-bottom:8px}
.empty p{color:var(--muted);margin-bottom:24px}

/* ---------- Product detail ---------- */
.pd{display:grid;grid-template-columns:1fr 1fr;gap:64px;padding:56px 0 112px}
.pd-art{position:relative;aspect-ratio:5/4;border-radius:24px;background:#e4e0da;overflow:hidden}
.pd-art .chip-c{left:20px;bottom:20px;font-size:13px}
.pd-art svg{width:72%}
.crumb{font-size:14px;color:var(--muted);margin-bottom:24px}
.crumb a{text-decoration:none}
.crumb a:hover{color:var(--ink)}
.pd h1{font-size:clamp(34px,4vw,48px);margin:10px 0 8px}
.pd .price{font-size:32px;margin:28px 0 4px}
.pd .vat{font-size:13px;color:var(--muted)}
.specs{margin:32px 0;border-top:1px solid var(--line)}
.specs div{display:grid;grid-template-columns:160px 1fr;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.specs dt{color:var(--muted)}
.specs dd{margin:0}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;height:48px;background:var(--card)}
.qty button{width:44px;height:100%;border:0;background:none;cursor:pointer;font-size:18px}
.qty span{min-width:28px;text-align:center;font-weight:600}
.pd-actions{display:flex;gap:12px;align-items:center}
.assure{margin-top:32px;padding:20px;border-radius:var(--radius);background:var(--t-M);display:flex;gap:14px;font-size:14px;color:#5a0533}
.assure b{display:block;margin-bottom:2px;font-size:15px}

/* ---------- Drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(17,18,16,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,100%);background:var(--paper);z-index:50;transform:translateX(100%);transition:transform .3s var(--ease);display:flex;flex-direction:column;border-left:1px solid var(--line)}
body.cart-open .scrim{opacity:1;pointer-events:auto}
body.cart-open .drawer{transform:none}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid var(--line)}
.drawer-head h2{font-size:22px}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center}
.lines{flex:1;overflow:auto;padding:8px 24px}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}
.line .mini{width:64px;height:64px;border-radius:10px;background:#e4e0da;overflow:hidden}
.line .mini svg{width:80%}
.line h4{font-size:15px;font-family:Inter;font-weight:600;letter-spacing:0}
.line .meta{font-size:13px;color:var(--muted)}
.line .qty{height:34px;margin-top:6px}
.line .qty button{width:32px;font-size:15px}
.line .rm{border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;padding:0;margin-left:10px}
.drawer-foot{padding:20px 24px 24px;border-top:1px solid var(--line);background:var(--card)}
.sum{display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px}
.sum.total{font-family:"Inter Tight";font-weight:700;font-size:20px;margin:12px 0 18px}
.ship-bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0 16px}
.ship-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--magenta));transition:width .3s}

/* ---------- Checkout ---------- */
.co{display:grid;grid-template-columns:1.2fr .8fr;gap:56px;padding:56px 0 112px;align-items:start}
.co h1{font-size:clamp(34px,4vw,48px);margin-bottom:8px}
fieldset{border:0;padding:0;margin:40px 0 0}
legend{font-family:"Inter Tight";font-weight:600;font-size:20px;margin-bottom:18px;padding:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fields .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
label.f span.opt{color:var(--muted);font-weight:400}
.f input,.f textarea{height:48px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:15px;outline:0;transition:border-color .15s}
.f textarea{height:96px;padding:12px 14px;resize:vertical}
.f input:focus,.f textarea:focus{border-color:var(--ink)}
.f input.bad{border-color:var(--warn)}
.f .err{color:var(--warn);font-size:13px;font-weight:400;min-height:0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer}
.opt:has(input:checked){border-color:var(--ink)}
.opt input{margin-top:4px;accent-color:var(--ink)}
.opt b{display:block;font-weight:600}
.opt small{color:var(--muted);font-size:13px}
.summary{position:sticky;top:96px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.summary h2{font-size:20px;margin-bottom:12px}
.summary .line{grid-template-columns:48px 1fr auto;padding:12px 0}
.summary .mini{width:48px;height:48px}

/* ---------- Thanks ---------- */
.thanks{padding:120px 0;max-width:640px}
.thanks .ok{width:56px;height:56px;border-radius:50%;background:var(--cyan);display:grid;place-items:center;margin-bottom:28px}
.thanks h1{font-size:clamp(36px,5vw,56px);margin-bottom:16px}
.thanks p{color:var(--ink-2);font-size:17px;margin-bottom:12px}

/* ---------- Toast ---------- */
.toast{white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s var(--ease);z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Responsive ---------- */
@media (max-width:1024px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .proof .wrap{grid-template-columns:repeat(2,1fr)}
  .proof .wrap>div:nth-child(3){border-left:0}
  .proof .wrap>div:nth-child(n+3){border-top:1px solid var(--line)}
}
@media (max-width:820px){
  .cmp{grid-template-columns:1fr;gap:56px;margin-bottom:56px}
  .cmp-sub{flex-direction:column;align-items:start;gap:8px}
  .wrap{padding:0 16px}
  nav.main{display:none;position:absolute;top:72px;left:0;right:0;flex-direction:column;gap:0;background:var(--paper);border-bottom:1px solid var(--line);padding:8px 16px}
  nav.main a{padding:14px 0;border-bottom:1px solid var(--line);font-size:17px}
  nav.main a:last-child{border-bottom:0}
  body.menu-open nav.main{display:flex}
  .menu-btn{display:grid;place-items:center;margin-left:auto}
  .top .wrap{gap:12px}
  .cart-btn .lbl{display:none}
  .hero{padding:48px 0 104px}
  .proof{margin-top:-56px}
  .proof .wrap{width:calc(100% - 32px);border-radius:16px}
  .hero-grid,.pd,.co,.contact{grid-template-columns:1fr;gap:40px}
  .hero-art{max-width:420px}
  .seal{width:92px;height:92px;font-size:11px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .card .body{padding:14px}
  .card h3{font-size:16px}
  section.block{padding:72px 0}
  .sec-head{flex-direction:column;align-items:start;margin-bottom:32px}
  .services{grid-template-columns:1fr}
  .svc-b{padding:0 24px 28px}
  .services{gap:12px}
  .compare-row{grid-template-columns:1fr 1fr}
  .compare-row .k{grid-column:1/-1;padding-bottom:0}
  .compare-row.head .k{display:none}
  .compare-row>div{padding:14px 16px}
  .toolbar{position:static}
  .toolbar .search{max-width:none;margin-left:0;order:-1;flex-basis:100%}
  .chips{overflow-x:auto;flex-wrap:nowrap;max-width:100%;padding-bottom:2px}
  .chip{flex:0 0 auto}
  .fields{grid-template-columns:1fr}
  .summary{position:static}
  .specs div{grid-template-columns:130px 1fr}
}
@media (max-width:420px){
  .proof .wrap>div{padding:20px 16px}
  .proof .wrap>div::before{left:16px}
  .proof b{font-size:22px}
  .proof span{font-size:13px;line-height:1.4;display:block}
}

/* ---------- Dodatne animacije ---------- */
.js .hero h1 .hl{background-size:0% 24%;transition:background-size .9s var(--ease) .45s}
.js .seen .hero h1 .hl,.js .hero .seen h1 .hl{background-size:100% 24%}

.js .hero .seen h1 .strike s{background-size:100% 5px}
.js .cmyk-bar i{transform:scaleY(0);transform-origin:bottom;transition:transform .5s var(--ease)}

.hero-art .stack svg{animation:float 3.2s ease-in-out infinite alternate}

@keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.js .compare-row .ico,.js .service .n{transform:scale(0)}

.js .proof .wrap>div::before{transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease)}

.card .thumb img{transition:transform .7s var(--ease)}

@keyframes ring{0%{box-shadow:0 0 0 0 rgba(230,0,126,.35)}100%{box-shadow:0 0 0 22px rgba(230,0,126,0)}}
.pin{animation:ring 2.2s ease-out infinite}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.cart-count.bump{animation:bump .4s var(--ease)}
.js .sec-head h2{clip-path:inset(0 0 100% 0);transition:clip-path .9s var(--ease) .1s}
.js .sec-head.seen h2{clip-path:inset(0 0 -10% 0)}

/* ---------- Scroll animacije (umirjene) ---------- */
.js .rv{opacity:0;transform:translateY(18px);transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:var(--d,0ms)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.js .rv{opacity:1;transform:none}.js .quality::before{transform:none}
  .js .hero h1 .hl{background-size:100% 24%}.js .hero h1 .strike s{background-size:100% 5px}.js .cmyk-bar i,.js .compare-row .ico,.js .service .n,.js .proof .wrap>div::before{transform:none}
  .js .sec-head h2{clip-path:none}.hero-art .stack svg,.pin,.cart-count.bump,.js .compare-row.seen .ico,.js .service.seen .n{animation:none}}

function saveCart(){ try{ localStorage.setItem("np_cart", JSON.stringify(cart)); }catch(e){} renderCart(); }
const cartItems = () => Object.entries(cart).map(([id,q])=>({p:byId(id),q})).filter(x=>x.p);
const subtotal = () => cartItems().reduce((s,x)=>s+x.p.price*x.q,0);
const shipping = () => { const s=subtotal(); return s===0||s>=SHOP.freeShipping?0:SHOP.shippingCost; };

function addToCart(id,q=1,btn){
  cart[id]=(cart[id]||0)+q; saveCart();
  toast(`${byId(id).name} dodan v košarico`);
  if(btn){ btn.classList.add("done"); btn.innerHTML=tick; setTimeout(()=>{btn.classList.remove("done");btn.innerHTML=plus},1200); }
}
function setQty(id,q){ if(q<=0) delete cart[id]; else cart[id]=q; saveCart(); if(location.hash.startsWith("#/blagajna")) route(); }

function renderCart(){
  const items = cartItems();
  $("#cartCount").textContent = items.reduce((s,x)=>s+x.q,0);
  const cc=$("#cartCount"); cc.classList.remove("bump"); void cc.offsetWidth; if(items.length) cc.classList.add("bump");
  if(!items.length){
    $("#cartLines").innerHTML = `<div class="empty"><h3>Košarica je prazna</h3><p>Poiščite toner za svoj tiskalnik.</p><a class="btn" href="#/trgovina" onclick="closeCart()">V trgovino</a></div>`;
    $("#cartFoot").innerHTML = ""; return;
  }
  $("#cartLines").innerHTML = items.map(({p,q})=>`
    <div class="line">
      <div class="mini" data-c="${p.color}">${photo(p)}</div>
      <div><h4>${esc(p.name)}</h4><div class="meta">${esc(p.code)} · ${eur(p.price)}</div>
        <div style="display:flex;align-items:center">
          <div class="qty"><button aria-label="Manj" onclick="setQty('${p.id}',${q-1})">−</button><span>${q}</span><button aria-label="Več" onclick="setQty('${p.id}',${q+1})">+</button></div>
          <button class="rm" onclick="setQty('${p.id}',0)">Odstrani</button>
        </div>
      </div>
      <div class="price" style="font-size:16px">${eur(p.price*q)}</div>
    </div>`).join("");
  const s=subtotal(), left=Math.max(0,SHOP.freeShipping-s);
  $("#cartFoot").innerHTML = `
    <div class="sum muted" style="font-size:13px">${left>0?`Še ${eur(left)} do brezplačne dostave`:"Dostava je brezplačna"}</div>
    <div class="ship-bar"><i style="width:${Math.min(100,s/SHOP.freeShipping*100)}%"></i></div>
    <div class="sum"><span class="muted">Vmesni seštevek</span><span>${eur(s)}</span></div>
    <div class="sum"><span class="muted">Dostava</span><span>${shipping()?eur(shipping()):"Brezplačno"}</span></div>
    <div class="sum total"><span>Skupaj z DDV</span><span>${eur(s+shipping())}</span></div>
    <a class="btn block" href="#/blagajna" onclick="closeCart()">Nadaljuj na naročilo</a>`;
}
function openCart(){ document.body.classList.add("cart-open"); $("#drawer").setAttribute("aria-hidden","false"); $("#closeCart").focus(); }
function closeCart(){ document.body.classList.remove("cart-open"); $("#drawer").setAttribute("aria-hidden","true"); }
$("#cartBtn").onclick=openCart; $("#closeCart").onclick=closeCart; $("#scrim").onclick=closeCart;
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeCart(); });

let tt; function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),1800); }

function renderResults(){
  const q = shopState.q.trim().toLowerCase();
  let list = PRODUCTS.filter(p=>
    (shopState.brand==="Vse"||p.brand===shopState.brand) &&
    (shopState.color==="all"||(shopState.color==="K"?p.color==="K":p.color!=="K")) &&
    (!q || [p.name,p.code,p.fits,p.brand].join(" ").toLowerCase().includes(q))
  );
  if(shopState.sort==="asc") list.sort((a,b)=>a.price-b.price);
  if(shopState.sort==="desc") list.sort((a,b)=>b.price-a.price);
  $("#results").innerHTML = list.length
    ? `<p class="muted" style="font-size:14px;margin-bottom:16px">${list.length} ${list.length===1?"izdelek":list.length===2?"izdelka":list.length<5?"izdelki":"izdelkov"}</p><div class="grid">${list.map(card).join("")}</div>`
    : `<div class="empty"><h3>Za „${esc(shopState.q)}“ nismo našli kasete</h3><p>Imamo jih več, kot jih je na spletu. Pišite nam model tiskalnika in vam pripravimo ponudbo.</p><a class="btn" href="mailto:${SHOP.email}?subject=${encodeURIComponent("Povpraševanje: "+shopState.q)}">Pošlji povpraševanje</a></div>`;
  reveal($("#results"));
}
function bindShop(){
  $("#brandChips").onclick=e=>{ const b=e.target.closest(".chip"); if(!b) return; shopState.brand=b.dataset.b; document.querySelectorAll("#brandChips .chip").forEach(c=>c.classList.toggle("on",c===b)); renderResults(); };
  $("#colorSel").value=shopState.color; $("#sortSel").value=shopState.sort;
  $("#colorSel").onchange=e=>{shopState.color=e.target.value;renderResults();};
  $("#sortSel").onchange=e=>{shopState.sort=e.target.value;renderResults();};
  $("#shopQ").oninput=e=>{shopState.q=e.target.value;renderResults();};
  renderResults();
}

function bindCheckout(){
  const f=$("#coForm"); if(!f) return;
  const shipCost = () => f.ship.value==="Osebni prevzem"?0:shipping();
  const refresh = () => { const sc=shipCost(); $("#shipVal").textContent=sc?eur(sc):"Brezplačno"; $("#totVal").textContent=eur(subtotal()+sc); f.querySelector('button[type=submit]').textContent=`Oddaj naročilo · ${eur(subtotal()+sc)}`; };
  f.querySelectorAll('input[name=ship]').forEach(r=>r.onchange=refresh);
  const msg = el => {
    if(!el.required) return "";
    if(!el.value.trim()) return "To polje izpolnite, prosim.";
    if(el.type==="email" && !/^\S+@\S+\.\S+$/.test(el.value)) return "Preverite e-naslov, npr. ime@podjetje.si.";
    if(el.name==="zip" && !/^\d{4}$/.test(el.value.trim())) return "Poštna številka ima 4 števke.";
    return "";
  };
  const validate = el => { const m=msg(el); el.classList.toggle("bad",!!m); const e=el.parentElement.querySelector(".err"); if(e) e.textContent=m; return !m; };
  f.querySelectorAll(".f input[required]").forEach(el=>{ el.addEventListener("blur",()=>validate(el)); el.addEventListener("input",()=>{ if(el.classList.contains("bad")) validate(el); }); });
  f.onsubmit = async e => {
    e.preventDefault();
    let ok=true, first=null;
    f.querySelectorAll(".f input[required]").forEach(el=>{ if(!validate(el)){ ok=false; first=first||el; } });
    $("#termsErr").textContent = f.terms.checked?"":"Za oddajo naročila potrdite splošne pogoje.";
    if(!f.terms.checked) ok=false;
    if(!ok){ (first||f.terms).focus(); return; }

    const d=Object.fromEntries(new FormData(f)), sc=shipCost();
    const no="NP-"+Date.now().toString().slice(-6);
    const lines=cartItems().map(({p,q})=>`${q} × ${p.name} (${p.code}) — ${eur(p.price*q)}`).join("\n");
    const body=`Naročilo ${no}\n\n${lines}\n\nDostava: ${d.ship} — ${sc?eur(sc):"brezplačno"}\nSkupaj z DDV: ${eur(subtotal()+sc)}\nPlačilo: ${d.pay}\n\n${d.name}${d.company?"\n"+d.company:""}${d.vat?"\nDŠ: "+d.vat:""}\n${d.street}\n${d.zip} ${d.city}\n${d.email} · ${d.phone}\n\nOpomba: ${d.note||"—"}`;

    if(SHOP.formEndpoint){
      try{
        const r=await fetch(SHOP.formEndpoint,{method:"POST",headers:{"Accept":"application/json","Content-Type":"application/json"},body:JSON.stringify({_subject:`Novo naročilo ${no}`,email:d.email,narocilo:body})});
        if(!r.ok) throw 0;
      }catch(_){ toast("Naročila nismo mogli poslati. Poskusite znova ali nas pokličite."); return; }
    }else{
      location.href=`mailto:${SHOP.email}?subject=${encodeURIComponent("Naročilo "+no)}&body=${encodeURIComponent(body)}`;
    }
    lastOrder={no,email:d.email,pay:d.pay}; cart={}; saveCart();
    setTimeout(()=>{ location.hash="#/hvala"; },400);
  };
}
let lastOrder=null;
function viewThanks(){
  return `<div class="wrap"><div class="thanks">
    <div class="ok">${tick.replace('width="16" height="16"','width="26" height="26"').replace('currentColor','#fff')}</div>
    <h1>Hvala za naročilo.</h1>
    ${lastOrder?`<p>Številka naročila: <b>${lastOrder.no}</b></p><p>${lastOrder.pay.startsWith("Predračun")?`Predračun vam pošljemo na <b>${esc(lastOrder.email)}</b> v enem delovnem dnevu.`:`Potrditev pošljemo na <b>${esc(lastOrder.email)}</b>. Paket plačate ob prevzemu.`}</p>`:`<p>Vaše naročilo smo prejeli.</p>`}
    <p class="muted">Vsako kaseto pred odpremo še enkrat preizkusimo.</p>
    <a class="btn ghost" href="#/trgovina" style="margin-top:24px">Nazaj v trgovino</a>
  </div></div>`;
}
function viewTerms(){
  return `<div class="wrap" style="padding:72px 16px 112px;max-width:760px">
    <div class="eyebrow">Pravno</div><h1 style="font-size:44px;margin:14px 0 24px">Splošni pogoji</h1>
    <p class="muted">Tukaj vstavite splošne pogoje poslovanja, politiko zasebnosti (GDPR), pravico do odstopa od pogodbe (14 dni) in podatke o podjetju: polni naziv, sedež, matična in davčna številka, vpis v sodni register.</p>
  </div>`;
}
function viewNotFound(){ return `<div class="wrap"><div class="empty" style="padding:140px 0"><h3>Strani ni mogoče najti</h3><p>Morda je izdelek odstranjen.</p><a class="btn" href="#/trgovina">V trgovino</a></div></div>`; }

/* =========================================================
   USMERJANJE
   ========================================================= */
function route(){
  const h=location.hash.replace(/^#\/?/,"");
  const [path,qs]=h.split("?"); const [seg,arg]=path.split("/");
  const app=$("#app");
  closeCart();
  document.body.classList.remove("menu-open"); $("#menuBtn").setAttribute("aria-expanded","false");
  document.querySelectorAll("nav.main a").forEach(a=>a.classList.toggle("on",a.dataset.nav===seg));
  let scrollTo=null;
  switch(seg){
    case "trgovina":
      if(qs){ const q=new URLSearchParams(qs).get("q"); if(q!==null){ shopState.q=q; shopState.brand="Vse"; } }
      app.innerHTML=viewShop(); bindShop(); break;
    case "izdelek": app.innerHTML=viewProduct(arg); break;
    case "blagajna": app.innerHTML=viewCheckout(); bindCheckout(); break;
    case "hvala": app.innerHTML=viewThanks(); break;
    case "pogoji": app.innerHTML=viewTerms(); break;
    case "kakovost": case "storitve": case "kontakt": app.innerHTML=viewHome(); scrollTo=seg; break;
    default: app.innerHTML=viewHome();
  }
  reveal($("#app"));
  if(scrollTo){ requestAnimationFrame(()=>{ const el=document.getElementById(scrollTo); if(el) window.scrollTo({top:el.offsetTop-72}); }); }
  else window.scrollTo(0,0);
}
$("#menuBtn").onclick=()=>{ const o=document.body.classList.toggle("menu-open"); $("#menuBtn").setAttribute("aria-expanded",o); };
window.addEventListener("hashchange",route);
$("#yr").textContent=new Date().getFullYear();

/* ===== Scroll animacije ===== */
document.documentElement.classList.add("js");
const RV_TARGETS = [
  ".hero-grid>*", ".proof .wrap>div", ".sec-head", ".grid>.card", ".compare-row",
  ".service", ".contact>*", ".shop-head", ".toolbar", ".pd>*", ".co>*", ".thanks", ".empty"
].join(",");
const rvIO = "IntersectionObserver" in window ? new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(!e.isIntersecting) return;
    const el=e.target; el.classList.add("in","seen"); rvIO.unobserve(el);
    el.querySelectorAll("[data-count]").forEach(countUp);
    if(el.classList.contains("rv")){
      // po končani animaciji odstrani razrede, da hover učinki delujejo normalno
      el.addEventListener("transitionend",function done(ev){ if(ev.target!==el||ev.propertyName!=="opacity") return; el.classList.remove("rv","in"); el.removeEventListener("transitionend",done); });
    }
  });
},{rootMargin:"0px 0px -8% 0px",threshold:.08}) : null;
function reveal(root=document){
  if(!rvIO) return;
  root.querySelectorAll(RV_TARGETS).forEach(el=>{
    if(el.dataset.rv) return; el.dataset.rv="1";
    const sibs=[...el.parentElement.children].filter(c=>c.matches(RV_TARGETS));
    el.style.setProperty("--d", (sibs.indexOf(el)%4)*80+"ms");
    el.classList.add("rv"); rvIO.observe(el);
  });
  root.querySelectorAll(".quality").forEach(el=>{ if(!el.dataset.rv){ el.dataset.rv="1"; rvIO.observe(el); } });
}
/* štetje številk */
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function countUp(el){
  if(reduceMotion || el.dataset.done) return; el.dataset.done="1";
  const end=+el.dataset.count, tpl=el.textContent, t0=performance.now(), dur=1300;
  const step=t=>{ const k=Math.min(1,(t-t0)/dur), v=Math.round(end*(1-Math.pow(1-k,3)));
    el.textContent=tpl.replace(String(end),v); if(k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
/* glava, napredek branja, paralaksa */
let ticking=false;
function onScroll(){
  const y=scrollY, max=document.documentElement.scrollHeight-innerHeight;
  $("header.top").classList.toggle("scrolled",y>8);
  $("#progress").style.setProperty("--p", max>0?(y/max).toFixed(4):0);
  if(!reduceMotion){
    const st=document.querySelector(".hero-art .ph img"), seal=document.querySelector(".seal");
    if(st && y<900){ st.style.setProperty("--py", (y*-0.06).toFixed(1)+"px"); }
    if(seal && y<900){ seal.style.setProperty("--rot", (y*0.08).toFixed(1)+"deg"); }
  }
  ticking=false;
}
addEventListener("scroll",()=>{ if(!ticking){ ticking=true; requestAnimationFrame(onScroll); } },{passive:true});
addEventListener("hashchange",()=>requestAnimationFrame(onScroll));
renderCart(); route(); onScroll();
</script>
